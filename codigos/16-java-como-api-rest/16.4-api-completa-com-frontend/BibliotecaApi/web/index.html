<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca IFPE</title>
  <style>
    :root { --fundo:#f6f7f9; --card:#ffffff; --texto:#1c2430; --suave:#5b6675; --linha:#dde2e9; --destaque:#1f7a4d; --perigo:#b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --fundo:#14181f; --card:#1d232d; --texto:#e8ecf2; --suave:#9aa6b6; --linha:#2d3643; --destaque:#4cc38a; --perigo:#f97066; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.sub { margin: 0 0 24px; color: var(--suave); }
    section { background: var(--card); border: 1px solid var(--linha); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    form { display: grid; grid-template-columns: 1fr 1fr 110px auto; gap: 10px; align-items: end; }
    label { display: grid; gap: 4px; font-size: .85rem; color: var(--suave); }
    input { width: 100%; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--linha); border-radius: 6px; background: var(--fundo); color: var(--texto); }
    button { font: inherit; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--destaque); color: #fff; cursor: pointer; }
    button.remover { background: transparent; color: var(--perigo); border: 1px solid var(--perigo); padding: 4px 10px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linha); }
    li:first-child { border-top: 0; }
    .detalhe { color: var(--suave); font-size: .9rem; }
    #mensagem { min-height: 1.4em; margin-top: 10px; font-size: .9rem; }
    #mensagem.erro { color: var(--perigo); }
    @media (max-width: 640px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Biblioteca IFPE</h1>
  <p class="sub">Frontend em HTML e JavaScript conversando com a API Java.</p>

  <section>
    <h2>Cadastrar livro</h2>
    <form id="formulario">
      <label>Título <input name="titulo" required></label>
      <label>Autor <input name="autor" required></label>
      <label>Ano <input name="ano" type="number" required></label>
      <button type="submit">Salvar</button>
    </form>
    <div id="mensagem" role="status"></div>
  </section>

  <section>
    <h2>Livros cadastrados (<span id="total">0</span>)</h2>
    <ul id="lista"></ul>
  </section>
</main>

<script>
  const API = "/livros";   // mesma origem do servidor Java: não precisa de CORS
  const lista = document.getElementById("lista");
  const mensagem = document.getElementById("mensagem");

  function avisar(texto, erro = false) {
    mensagem.textContent = texto;
    mensagem.className = erro ? "erro" : "";
  }

  async function carregar() {
    const resposta = await fetch(API);                 // GET /livros
    const livros = await resposta.json();
    lista.replaceChildren();
    for (const livro of livros) {
      const item = document.createElement("li");
      const texto = document.createElement("div");
      const titulo = document.createElement("strong");
      titulo.textContent = livro.titulo;               // textContent evita injeção de HTML
      const detalhe = document.createElement("div");
      detalhe.className = "detalhe";
      detalhe.textContent = livro.autor + ", " + livro.ano;
      texto.append(titulo, detalhe);

      const botao = document.createElement("button");
      botao.className = "remover";
      botao.textContent = "Remover";
      botao.addEventListener("click", () => remover(livro.id));

      item.append(texto, botao);
      lista.append(item);
    }
    document.getElementById("total").textContent = livros.length;
  }

  async function remover(id) {
    const resposta = await fetch(API + "/" + id, { method: "DELETE" });   // DELETE /livros/{id}
    if (resposta.ok) { avisar("Livro removido."); carregar(); }
    else { avisar("Não foi possível remover.", true); }
  }

  document.getElementById("formulario").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const dados = new FormData(evento.target);
    const livro = {
      titulo: dados.get("titulo"),
      autor: dados.get("autor"),
      ano: Number(dados.get("ano"))
    };
    const resposta = await fetch(API, {                // POST /livros
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(livro)
    });
    if (resposta.status === 201) {
      avisar("Livro cadastrado.");
      evento.target.reset();
      carregar();
    } else {
      const erro = await resposta.json();
      avisar(erro.erro, true);
    }
  });

  carregar();
</script>
</body>
</html>
